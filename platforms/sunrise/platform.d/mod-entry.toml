# Client command completion, Options > Mods key rows and the settings button.
# `commands` and the key rows live in the mod crate (Hooks::register_client_commands / register);
# the settings button is a registered toggle whose change opens the mod menu.

[injection.commands]
drop = true
reason = "client commands are registered by Hooks::register_client_commands (overlay/crate/mod_entry.rs)"

[injection.list]
drop = true
reason = "the Options > Mods row comes from sunrise-mod.toml; key rows from Hooks::register (overlay/crate/mod_entry.rs)"

[injection.menu-options]
drop = true
reason = "the settings button is the open_menu toggle registered in overlay/crate/mod_entry.rs"

# The settings button is a toggle. Since Dev bdad86d `native_setting_changed` takes `&self`, so the hook
# sits on the write path instead (`apply_native_setting_write`, shared by Options > Mods and typed
# writes): a press is answered there and never stored, so the toggle stays off.
[injection.menu-options-click]
drop = false
target = "sunrise_client::game::native_hooks::mod_settings::Game<'_>::apply_native_setting_write"
kind = "HEAD"
cancellable = true
helper = "mod_entry/settings_toggle_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "owner", ty = "&'static str", value = "owner" },
  { name = "spec", ty = "&'static SettingSpec", value = "spec" },
  { name = "value", ty = "SettingValue", value = "value" },
]
